name: Rotate Demo Passwords (one-time cleanup)

on:
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Delete stale demo accounts (old hardcoded demo1234 password)
        run: |
          node -e "
          const { neon } = require('@neondatabase/serverless');
          const sql = neon(process.env.DATABASE_URL);
          (async () => {
            const emails = ['demo@luhgerald.com', 'marketing@luhgerald.com', 'ops@luhgerald.com'];
            for (const email of emails) {
              const res = await sql\`DELETE FROM users WHERE email = \${email} RETURNING email\`;
              console.log(res.length ? \`Deleted \${email}\` : \`\${email} not found, skipping\`);
            }
          })().catch((err) => { console.error(err); process.exit(1); });
          "
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Reseed with fresh random passwords
        run: npm run seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
